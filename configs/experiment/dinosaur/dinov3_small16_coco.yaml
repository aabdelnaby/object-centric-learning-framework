# @package _global_
# DINOSAUR with a frozen DINOv3 ViT-S/16 backbone, trained for feature reconstruction on COCO.
#
# Frozen ViT-S/16 patch features (CLS + 4 register tokens dropped → 196 tokens) →
# RandomConditioning (n_slots, learned mean/std) → SlotAttention → AutoregressivePatchDecoder.
# This is the slot module every downstream thesis experiment uses frozen. The 11-slot run
# (models.conditioning.n_slots=11) produced checkpoints/dinosaur_dinov3_vits16_coco.ckpt;
# because the conditioning parameters are slot-count independent, the same weights are
# instantiated with 9 (PACO) or 7 (CUB) slots downstream.
#
#   experiments/01_train_dinosaur.sh
#   python -m ocl.cli.train +experiment=dinosaur/dinov3_small16_coco models.conditioning.n_slots=11

defaults:
  - /experiment/dinosaur/_base_feature_recon
  - /dataset: coco
  - /experiment/dinosaur/_preprocessing_coco_ccrop
  - /experiment/dinosaur/_metrics_coco
  - _self_

trainer:
  devices: 1
  max_steps: 500000
  max_epochs:
  gradient_clip_val: 1.0

dataset:
  num_workers: 4
  batch_size: 16

experiment:
  input_feature_dim: 384   # DINOv3 ViT-S embedding dim

models:
  conditioning:
    _target_: routed.ocl.conditioning.RandomConditioning
    n_slots: 7
    object_dim: 256
    batch_size_path: input.batch_size

  feature_extractor:
    model_name: vit_small_patch16_dinov3.lvd1689m
    pretrained: true
    freeze: true

  # Replace the base PatchDecoder with an AutoregressivePatchDecoder (SLATE-style).
  # No hierarchy modules below this point.
  object_decoder:
    _target_: routed.ocl.decoding.AutoregressivePatchDecoder
    decoder_cond_dim: ${.output_dim}
    use_input_transform: true
    use_decoder_masks: true
    resize_mode: bicubic
    decoder:
      _target_: ocl.neural_networks.build_transformer_decoder
      _partial_: true
      n_layers: 4
      n_heads: 8
      return_attention_weights: true
    masks_path: perceptual_grouping.feature_attributions
    object_features_path: perceptual_grouping.objects
