[tool.poetry]
name = "hier-dinosaur"
version = "1.0.0"
description = "Hierarchical-DINOSAUR and the HierRouter: hierarchical object-centric inference over self-supervised visual features"
license = "Apache-2.0"
readme = "README.md"
authors = ["Ahmed Abdelnaby <a.abdelnaby02@gmail.com>"]
include = ["configs/"]
packages = [
    { include = "hier_dinosaur" },
    { include = "ocl" },
    { include = "routed" },
]

[tool.poetry.scripts]
# Upstream framework entry point, used to pretrain the DINOSAUR slot module (experiments/01).
ocl_train = "ocl.cli.train:train"

[tool.poetry.dependencies]
python = ">=3.8.1,<3.9"
torch = "^2.0.0"
torchvision = "^0.15.1"
pytorch-lightning = "^2.0.0"
torchmetrics = "^0.11.1"
torchdata = "^0.6.0"
torchtyping = "^0.1.4"          # breaks on torch >= 2.4; keep the torch pin above
timm = ">=1.0.0"                # DINOv3 backbones need the 1.x model registry
transformers = "^4.46.0"        # T5 text encoder
sentencepiece = "^0.2.0"
hydra-core = "^1.3.0"
hydra-zen = "^0.7.0"
webdataset = "0.1.103"
pycocotools = "^2.0.7"
einops = "^0.6.0"
braceexpand = "^0.1.7"
numpy = "<2"
pandas = "^2.0.0"
scipy = "^1.10.0"
scikit-learn = "^1.3.0"
matplotlib = "^3.7.0"
tqdm = "^4.64.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.0.1"

[build-system]
requires = ["poetry-core>=1.5.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 110
target-version = ["py38"]

[tool.isort]
profile = "black"
line_length = 110
