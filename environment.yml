# Main environment. Versions are the ones the thesis experiments ran with; the torch pin matters
# (torchtyping, used by the upstream framework, breaks on newer torch), and timm must be >= 1.0
# for the DINOv3 backbone.
#
#   conda env create -f environment.yml && conda activate oclf_env && pip install -e .
name: oclf_env
channels: [pytorch, nvidia, conda-forge, defaults]
dependencies:
  - python=3.8
  - pip
  - pip:
      - torch==2.0.0
      - torchvision==0.15.1
      - pytorch-lightning==2.0.2
      - torchmetrics==0.11.4
      - torchdata==0.6.0
      - torchtyping==0.1.4
      - timm==1.0.22
      - transformers==4.46.3
      - sentencepiece==0.2.0
      - hydra-core==1.3.2
      - hydra-zen==0.7.1
      - omegaconf==2.3.0
      - webdataset==0.1.103
      - pycocotools==2.0.7
      - einops==0.6.1
      - braceexpand==0.1.7
      - numpy==1.24.3
      - pandas==2.0.1
      - scipy==1.10.1
      - scikit-learn==1.3.2
      - matplotlib==3.7.5
      - pillow==10.4.0
      - tqdm==4.66.5
      - pytest==7.4.4
